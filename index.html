<!DOCTYPE html>
<html lang="pt-br" dataContexto="foco">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fokus</title>
    <link rel="shortcut icon" href="./imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
        integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Prata&family=Unbounded:wght@200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="/app/main.js"></script>
    <script type="module" src="/app/funcoesTasks.js"></script>
</head>

<body>
    <main class="app">
        <header class="appHeader">
            <figure class="appLogoFigure">
                <img class="appLogoImage" src="/imagens/logo.png" alt="">
            </figure>
        </header>
        <section class="appSectionBannerContainer">
            <h1 class="appTitle">
                Otimize sua produtividade,<br>
                <strong class="appTitleStrong">mergulhe no que importa.</strong>
            </h1>
            <figure class="appImageFigure">
                <img class="appImage" src="/imagens/foco.png" alt="">
            </figure>
        </section>
        <section class="appSectionCardContainer">
            <div class="appCard">
                <ul class="appCardList">
                    <li class="appCardListItem">
                        <button dataContexto="foco" class="appCardButton appCardButton--foco">Foco</button>
                    </li>
                    <li class="appCardListItem">
                        <button dataContexto="short" class="appCardButton appCardButton--curto">Descanso curto</button>
                    </li>
                    <li class="appCardListItem">
                        <button dataContexto="long" class="appCardButton appCardButton--longo">Descanso longo</button>
                    </li>
                </ul>
                <div id="timer" class="appCardTimer"></div>
                <ul class="appCardList">
                    <li class="appCardListItem">
                        <label class="toggle">
                            <input class="toggleCheckbox" type="checkbox" id="alternarMusica">
                            <div class="toggleSwitch"></div>
                        </label>
                    </li>
                    <li class="appCardListItem">
                        <label class="appCardListLabel" for="alternarMusica">
                            Música
                        </label>
                    </li>
                </ul>
                <div class="appCardPrimaryButtonWrapper">
                    <button id="startPause" class="appCardPrimaryButton">
                        <img class="appCardPrimaryButtoIcon" src="/imagens/playArrow.png" alt="">
                        <span>Começar</span>
                    </button>
                </div>
            </div>
        </section>
        <section class="appSectionTaskContainer">
            <div class="appSectionTaskContent">
                <header class="appSectionActiveTask">
                    <p class="appSectionActiveTaskLabel">#Em andamento:</p>
                    <p class="appSectionActiveTaskDescription"></p>
                </header>
                <div class="appSectionTaskHeader">
                    <h2 class="appSectionTasksHeading">Lista de tarefas:</h2>
                    <div class="dropdownContainer">
                        <button class="appButtonMore">
                            <img src="/imagens/more.svg" alt="">
                        </button>
                        <ul class="appSectionTaskHeaderUl">
                            <li class="appSectionTaskHeaderLi">
                                <button class="appSectionTaskHeaderLiButton" id="btnRemoverConcluidas">
                                    <img src="/imagens/check.svg" alt="">
                                    Limpar tarefas concluídas
                                </button>
                            </li>
                            <li class="appSectionTaskHeaderLi">
                                <button class="appSectionTaskHeaderLiButton" id="btnRemoverTodas">
                                    <img src="/imagens/trash.svg" alt="">
                                    Limpar todas as tarefas
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
                <ul class="appSectionTaskList"></ul>
                <form class="appForm--addTask hidden" aria-hidden="true">
                    <div class="appFormField">
                        <label class="appFormLabel">
                            Adicionando tarefa
                        </label>
                        <textarea required rows="4" class="appFormTextarea" placeholder="No que você está trabalhando?"></textarea>
                    </div>
                    <footer class="appFormFooter">
                        <button type="button" class="appFormFooterButton appFormFooterButtonDelete">
                            <img src="/imagens/delete.png" alt=""> Deletar
                        </button>
                        <div class="splitter"></div>
                        <button type="button" class="appFormFooterButton appFormFooterButtonCancel">
                            <img src="/imagens/close.png" alt=""> Cancelar
                        </button>
                        <button class="appFormFooterButton appFormFooterButtonConfirm">
                            <img src="/imagens/save.png" alt=""> Salvar
                        </button>
                    </footer>
                </form>
                <button class="appButton--addTask">
                    <img src="/imagens/addCircle.png" alt=""> Adicionar nova tarefa
                </button>
            </div>
        </section>

        <footer class="appFooter">
            <p class="appFooterText">
                Projeto fictício e sem fins comerciais. Imagens geradas por IA no Adobe Firefly.Desenvolvido por Alura. 
            </p>
        </footer>
    </main>

</body>

</html>
