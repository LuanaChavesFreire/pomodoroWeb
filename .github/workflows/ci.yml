name: CI - Integração Contínua

# Quando esse workflow vai rodar?
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------
  # JOB 1: Verificação de qualidade do código (Lint)
  # -------------------------------------------------------
  lint:
    name: Análise de Código (Lint)
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Instala o Node.js na máquina virtual do GitHub
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Passo 3: Instala as dependências (ESLint, Jest, etc)
      - name: Instalar dependências
        run: npm install

      # Passo 4: Roda o ESLint — se tiver erro de código, o CI falha aqui
      - name: Rodar Lint (ESLint)
        run: npm run lint

  # -------------------------------------------------------
  # JOB 2: Testes automatizados
  # -------------------------------------------------------
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    # Só roda os testes se o lint passou!
    needs: lint

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      # Roda os testes com relatório de cobertura
      - name: Rodar testes com cobertura
        run: npm run test:ci

      # Salva o relatório de cobertura como artefato (opcional, mas bonito!)
      - name: Salvar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # -------------------------------------------------------
  # JOB 3: Confirmação final — se chegou aqui, tudo passou!
  # -------------------------------------------------------
  ci-success:
    name: ✅ CI Aprovado
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: 🎉 Pipeline CI concluído com sucesso!
        run: |
          echo "========================================="
          echo "✅ Lint passou!"
          echo "✅ Testes passaram!"
          echo "✅ Código aprovado para merge!"
          echo "========================================="